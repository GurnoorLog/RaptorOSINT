
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPTOROSINT | CYBER_PREDATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&family=Fira+Code:wght@300;400&display=swap');
      
      :root {
        --raptor-cyan: #00f2ff;
        --raptor-purple: #bd00ff;
        --raptor-pink: #ff00ff;
        --raptor-gold: #ff9d00;
        --raptor-bg: #020408;
      }

      body {
        font-family: 'Exo 2', sans-serif;
        background-color: var(--raptor-bg);
        color: #f8fafc;
        overflow: hidden;
      }

      /* Image-inspired Background */
      .raptor-lab {
        background: 
          radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(189, 0, 255, 0.05) 0%, transparent 50%),
          linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
      }

      /* Top Neon Bar from Image */
      .top-neon-bar {
        height: 4px;
        background: var(--raptor-cyan);
        box-shadow: 0 0 20px var(--raptor-cyan), 0 0 40px rgba(0, 242, 255, 0.5);
        position: fixed;
        top: 20px;
        left: 10%;
        right: 10%;
        z-index: 100;
        border-radius: 2px;
        opacity: 0.8;
      }

      /* Digital Rain / Scanlines */
      .digital-rain {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 242, 255, 0.03) 2px);
        background-size: 100% 3px;
        pointer-events: none;
        z-index: 5;
        animation: rain-scroll 20s linear infinite;
      }

      @keyframes rain-scroll {
        0% { background-position: 0 0; }
        100% { background-position: 0 1000px; }
      }

      .sao-header {
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 900;
      }

      .raptor-panel {
        background: rgba(5, 8, 15, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 242, 255, 0.15);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      }

      .raptor-btn {
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .raptor-btn:hover {
        filter: brightness(1.2);
        box-shadow: 0 0 20px currentColor;
      }

      .raptor-hex {
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      }

      /* Pulsing Radar Effect from Image */
      .radar-pulse {
        position: relative;
      }
      .radar-pulse::after {
        content: '';
        position: absolute;
        inset: -20px;
        border: 2px solid rgba(0, 242, 255, 0.1);
        border-radius: 50%;
        animation: radar-grow 3s ease-out infinite;
      }

      @keyframes radar-grow {
        0% { transform: scale(0.5); opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
      ::-webkit-scrollbar-thumb { background: var(--raptor-cyan); border-radius: 10px; }

      /* Glitch effect for major titles */
      .glitch-text:hover {
        animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
      }

      @keyframes glitch {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }
    </style>
<script type="importmap">
{

</head>

    <div class="digital-rain"></div>
    <div id="root"></div>

</body>
</html>
